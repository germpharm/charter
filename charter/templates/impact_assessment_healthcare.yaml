# Charter AI Impact Assessment Template — Healthcare
# Maps to NIST AI RMF MAP-1.1, MAP-2.1, MAP-5.1 and EU AI Act Article 9
# Usage: charter impact-assessment --domain healthcare

domain: healthcare
version: "1.0"
framework_references:
  - NIST AI RMF 1.0 (MAP-1.1, MAP-2.1, MAP-5.1, GOVERN-1.3)
  - EU AI Act Article 9 (Risk Management System)
  - HIPAA Security Rule 164.308(a)(1)
  - ISO/IEC 42001:2023

# Section 1: System Description
system_description:
  questions:
    - What is the intended purpose of this AI system?
    - What clinical decisions does it support or automate?
    - Who are the end users (pharmacists, physicians, nurses, administrators)?
    - What patient populations does it serve?
    - What PHI does it access, process, or generate?
    - What is the deployment setting (hospital, clinic, remote, telepharmacy)?

# Section 2: Risk Classification
risk_classification:
  eu_ai_act_category: high_risk  # Healthcare AI is typically high-risk under EU AI Act
  questions:
    - Does this system make or support clinical decisions?
    - Does it process protected health information (PHI)?
    - Could a malfunction cause patient harm?
    - Does it operate autonomously or with human oversight?
    - Is it used in emergency/time-critical settings?
  risk_levels:
    critical: "System makes autonomous clinical decisions affecting patient safety"
    high: "System supports clinical decisions with human review required"
    medium: "System processes PHI for operational purposes (scheduling, routing)"
    low: "System handles non-clinical administrative tasks without PHI"

# Section 3: Impact Analysis
impact_analysis:
  patient_safety:
    - What happens if the AI provides incorrect clinical information?
    - What happens if the AI is unavailable during a critical workflow?
    - Are there manual fallback procedures for all AI-assisted processes?
    - What is the maximum acceptable response time for clinical queries?
  data_privacy:
    - What is the minimum necessary PHI for the system to function?
    - How is PHI masked, encrypted, or de-identified in transit and at rest?
    - Who has access to raw PHI vs. de-identified data?
    - What is the data retention period and disposal method?
  equity_and_bias:
    - Does the system perform equally across patient demographics?
    - Are there populations that could be underserved or harmed?
    - How is performance validated across demographic groups?
    - Are there accessibility requirements for end users with disabilities?
  operational:
    - What is the impact on clinical workflow if the system fails?
    - Are pharmacists/clinicians trained on the system's limitations?
    - What is the escalation path when the AI is uncertain?
    - How are system updates deployed without disrupting patient care?

# Section 4: Governance Controls
governance_controls:
  layer_a_mapping:
    - "Never send patient communications without pharmacist review"
    - "Never access patient records without explicit authorization"
    - "Never disclose PHI outside authorized channels"
    - "Never make clinical recommendations without licensed pharmacist approval"
    - "Never bypass MFA or authentication controls"
  layer_b_mapping:
    - "patient_communication → always requires human_approval"
    - "clinical_decision → always requires human_approval"
    - "data_access (sensitive) → requires human_review"
  kill_triggers:
    - "HIPAA violation detected → graduated response"
    - "Audit trail tampering → hard kill"
    - "Credential exposure → hard kill"

# Section 5: Mitigation Plan
mitigation_plan:
  questions:
    - For each identified risk, what mitigation is in place?
    - What residual risk remains after mitigation?
    - Who is responsible for monitoring each risk?
    - What is the review frequency for this assessment?
    - What triggers a reassessment (new features, incidents, regulatory changes)?

# Section 6: Stakeholder Sign-Off
sign_off:
  roles_required:
    - Clinical lead (pharmacist, physician, or nurse manager)
    - IT/security officer
    - Compliance officer
    - System operator
  attestation: |
    By signing this assessment, the undersigned confirm that:
    1. The AI system has been evaluated against the criteria above.
    2. Identified risks have documented mitigation plans.
    3. Charter governance controls (Layer A/B/C) are in place and active.
    4. This assessment will be reviewed at the frequency specified above.
